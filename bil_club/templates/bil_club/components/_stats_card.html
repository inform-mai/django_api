<div class="col-6 col-lg-3">
    <div class="card card-sm">
        <div class="card-body">
            <div class="row align-items-center">
                <div class="col-auto">
                    <span class="bg-{{ color|default:'blue' }}-lt text-{{ color|default:'blue' }} avatar">
                        {{ icon|default:'📊' }}
                    </span>
                </div>
                <div class="col">
                    <div class="font-weight-medium">{{ value }}</div>
                    <div class="text-muted">{{ title }}</div>
                </div>
            </div>
        </div>
    </div>
</div>
